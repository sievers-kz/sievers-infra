services:
  backend:
    networks:
      default: {}
      proxy:
        aliases:
          - ${PROXY_ALIAS:?PROXY_ALIAS is not set}

  # Публичный доступ к MinIO идёт через nginx (media-<окружение>.market.sievers.kz).
  # Отдельный алиас, чтобы staging и production не пересекались по имени `minio`.
  minio:
    networks:
      default: {}
      proxy:
        aliases:
          - ${PROXY_ALIAS:?PROXY_ALIAS is not set}-minio

networks:
  proxy:
    external: true
