server {

    server_name api.market.sievers.kz;
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://market-production-backend:8000;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/market.sievers.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/market.sievers.kz/privkey.pem; # managed by Certbot
    include /etc/nginx/snippets/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/nginx/snippets/ssl-dhparams.pem; # managed by Certbot

}


