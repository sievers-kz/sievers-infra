# Публичный адрес MinIO (staging): по нему браузер открывает и загружает файлы
# по подписанным ссылкам. Бэкенд подписывает ссылки на этот хост (MINIO_PUBLIC_ENDPOINT).
server {

    server_name media-test.market.sievers.kz;
    resolver 127.0.0.11 valid=10s;

    # Загрузка идёт прямым PUT от браузера: тело запроса не буферизуем.
    client_max_body_size 25m;

    location / {
        set $upstream http://market-staging-backend-minio:9000;
        proxy_pass $upstream;

        # Подпись ссылки привязана к хосту: MinIO должен получить исходный Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/market.sievers.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market.sievers.kz/privkey.pem;
    include /etc/nginx/snippets/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/snippets/ssl-dhparams.pem;

}
