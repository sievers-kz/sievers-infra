name: Deploy market backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: "Тег образа (staging-<sha> или production-<sha>)"
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: market-backend-${{ inputs.environment }}
    concurrency:
      group: market-backend-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.environment }}
        run: |
          [[ "$TAG" =~ ^${TARGET}-[a-f0-9]{40}$ ]] || { echo "Тег не подходит для $TARGET"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "products/market/services/backend/docker-compose.yml,products/market/services/backend/docker-compose.proxy.yml"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 4
          overwrite: true

      - name: Write .env on VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          TAG: ${{ inputs.tag }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          {
            printf '%s\n' "$ENV_FILE" | grep -v '^IMAGE_TAG='
            printf 'IMAGE_TAG=%s\n' "$TAG"
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077 && cat > '$DEPLOY_PATH/.env.new' && mv '$DEPLOY_PATH/.env.new' '$DEPLOY_PATH/.env'"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            export COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
            docker compose config -q
            docker compose pull
            docker compose up -d
            docker compose ps
            APP_PORT=$(grep '^APP_PORT=' .env | cut -d= -f2)
            curl -fsS -o /dev/null --retry 20 --retry-delay 3 --retry-connrefused --retry-all-errors "http://127.0.0.1:$APP_PORT/docs"