server {
    server_name sievers.kz;

    location / {
        default_type text/plain;
        return 200 "Sievers Market - coming soon\n";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sievers.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sievers.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

