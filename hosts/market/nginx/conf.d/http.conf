server {
    listen 80;
    listen [::]:80;

    server_name
        api.market.sievers.kz
        api-test.market.sievers.kz
        market.sievers.kz
        test.market.sievers.kz
        sievers.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}